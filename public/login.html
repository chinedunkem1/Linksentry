<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Linkaware</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <img src="/logo.svg" alt="Linkaware logo" width="32" height="32" />
        <span class="brand-name">Link<span class="brand-accent">aware</span></span>
      </a>
      <a href="/signup" class="btn btn-small">Create account</a>
    </div>
  </header>

  <main class="auth-wrap">
    <form class="auth-card" id="login-form">
      <h1>Welcome back</h1>
      <p class="auth-sub">Sign in to access your dashboard, scan history, and API keys.</p>
      <div class="form-error" id="form-error" hidden></div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign in</button>
      <p class="auth-alt">New to Linkaware? <a href="/signup">Create a free account</a></p>
    </form>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const errBox = document.getElementById('form-error');
    const btn = document.getElementById('submit-btn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true; btn.textContent = 'Signing in…'; errBox.hidden = true;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Sign in failed.');
        location.href = '/dashboard';
      } catch (err) {
        errBox.textContent = err.message; errBox.hidden = false;
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
