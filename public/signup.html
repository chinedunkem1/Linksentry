<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — Linkaware</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <img src="/logo.svg" alt="Linkaware logo" width="32" height="32" />
        <span class="brand-name">Link<span class="brand-accent">aware</span></span>
      </a>
      <a href="/login" class="btn btn-small">Sign in</a>
    </div>
  </header>

  <main class="auth-wrap">
    <form class="auth-card" id="auth-form" data-endpoint="/api/auth/signup" data-busy-label="Creating account…">
      <h1>Create your free account</h1>
      <p class="auth-sub">Unlock scan history, bulk scanning, and API access. No credit card, ever.</p>
      <div class="form-error" id="form-error" hidden></div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password <span style="font-weight:400">(min. 8 characters)</span></label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
      </div>
      <div class="hp-field" aria-hidden="true">
        <label for="website">Leave this field empty</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
      <p class="auth-alt">Already have an account? <a href="/login">Sign in</a></p>
    </form>
  </main>

  <script src="/auth.js"></script>
</body>
</html>
