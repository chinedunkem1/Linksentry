<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — Linkaware</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <img src="/logo.svg" alt="Linkaware logo" width="36" height="36" />
        <span class="brand-name">Link<span class="brand-accent">aware</span></span>
      </a>
      <a href="/login" class="btn btn-small">Sign in</a>
    </div>
  </header>

  <main class="auth-wrap">
    <form class="auth-card" id="signup-form">
      <h1>Create your free account</h1>
      <p class="auth-sub">Unlock scan history, bulk scanning, and API access. No credit card required.</p>
      <div class="form-error" id="form-error" hidden></div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password <span style="font-weight:400">(min. 8 characters)</span></label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
      <p class="auth-alt">Already have an account? <a href="/login">Sign in</a></p>
    </form>
  </main>

  <script>
    const form = document.getElementById('signup-form');
    const errBox = document.getElementById('form-error');
    const btn = document.getElementById('submit-btn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true; btn.textContent = 'Creating account…'; errBox.hidden = true;
      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Signup failed.');
        location.href = '/dashboard';
      } catch (err) {
        errBox.textContent = err.message; errBox.hidden = false;
        btn.disabled = false; btn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
