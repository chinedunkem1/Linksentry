<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan report — LinkSentry</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <img src="/logo.svg" alt="LinkSentry logo" width="36" height="36" />
        <span class="brand-name">Link<span class="brand-accent">Sentry</span></span>
      </a>
      <a href="/#scanner" class="btn btn-small">Scan a link</a>
    </div>
  </header>

  <main class="report-main">
    <div class="container container-narrow">
      <div class="report-brandline">
        <div>
          <h1 style="font-size:1.5rem;font-weight:800">Link safety report</h1>
          <p class="muted" id="report-id-line"></p>
        </div>
        <div class="report-actions" style="display:flex;gap:10px">
          <button class="btn btn-ghost" id="copy-link-btn">Copy link</button>
          <button class="btn btn-ghost" id="download-json-btn">Download JSON</button>
          <button class="btn btn-ghost" onclick="window.print()">Print / PDF</button>
        </div>
      </div>

      <div id="report-error" class="scan-error" hidden></div>

      <div id="results" class="results" hidden style="margin-top:0;max-width:none">
        <div class="results-header">
          <div class="gauge-wrap">
            <svg class="gauge" viewBox="0 0 120 120">
              <circle class="gauge-track" cx="60" cy="60" r="52" />
              <circle class="gauge-fill" id="gauge-fill" cx="60" cy="60" r="52" />
            </svg>
            <div class="gauge-center">
              <span id="gauge-score">0</span>
              <small>risk</small>
            </div>
          </div>
          <div class="verdict-wrap">
            <div class="verdict-pill" id="verdict-pill">—</div>
            <p class="verdict-text" id="verdict-text"></p>
            <div class="scanned-url" id="scanned-url"></div>
          </div>
        </div>

        <div id="redirect-panel" class="redirect-panel" hidden>
          <h3>Redirect chain</h3>
          <ol id="redirect-list" class="redirect-list"></ol>
        </div>

        <div id="domain-panel" class="domain-panel" hidden></div>

        <div id="screenshot-panel" class="screenshot-panel" hidden>
          <h3>Visual preview <span class="shot-note">— rendered in a remote sandbox, not on your device</span></h3>
          <img id="screenshot-img" loading="lazy" alt="" />
        </div>

        <h3 class="findings-title">Detailed findings</h3>
        <ul id="findings" class="findings"></ul>

        <div class="results-footer">
          <span id="scan-meta"></span>
          <a class="btn btn-ghost" href="/#scanner">Scan another link</a>
        </div>
      </div>

      <p class="muted" style="margin-top:22px;text-align:center">
        Generated by <a href="/" style="color:var(--accent);text-decoration:none">LinkSentry</a> — free URL safety scanner. Results reflect the moment of scanning.
      </p>
    </div>
  </main>

  <script src="/render.js"></script>
  <script>
    (async () => {
      const id = location.pathname.split('/').pop();
      const errBox = document.getElementById('report-error');
      try {
        const res = await fetch('/api/report/' + encodeURIComponent(id));
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Report not found.');
        document.title = `Scan report: ${data.domain} — LinkSentry`;
        document.getElementById('report-id-line').textContent =
          `Report ${id} · scanned ${new Date(data.scannedAt).toLocaleString()}`;
        LSRender.render(data);

        document.getElementById('copy-link-btn').addEventListener('click', async () => {
          await navigator.clipboard.writeText(location.href);
          const btn = document.getElementById('copy-link-btn');
          btn.textContent = 'Copied!';
          setTimeout(() => (btn.textContent = 'Copy link'), 1800);
        });
        document.getElementById('download-json-btn').addEventListener('click', () => {
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `linksentry-report-${id}.json`;
          a.click();
          URL.revokeObjectURL(a.href);
        });
      } catch (err) {
        errBox.textContent = err.message;
        errBox.hidden = false;
      }
    })();
  </script>
</body>
</html>
