# One-click deploy config for Render (https://render.com)
#
# This uses the FREE plan. Note: free web services have EPHEMERAL disk — the
# SQLite database (accounts, scan history) resets whenever the service
# restarts or redeploys. Great for testing / a public demo.
#
# To make data persistent later, upgrade to plan "starter" (~$7/mo) and add:
#     disk:
#       name: linkaware-data
#       mountPath: /var/data
#       sizeGB: 1
# then set DATA_DIR=/var/data below.
services:
  - type: web
    name: linkaware
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
